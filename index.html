    <!-- css link -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- icon -->
    <link rel="icon" href="assets/images/carts.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

<body>

    <header class="position-sticky top-0 z-3">
        <nav class="navbar navbar-expand-lg bg-secondary-subtle py-2 ">
            <div class="container ">
                <a class="navbar-brand fw-bolder fs-4" href="#">Arova</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 ">
                        <li class="nav-item mx-2">
                            <a class="nav-link  fs-5" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item mx-1">
                            <a class="nav-link fs-5" href="#">Product</a>
                        </li>
                        <li class="nav-item mx-2">
                            <a class="nav-link fs-5" href="#">About</a>
                        </li>

                    </ul>

                </div>
            </div>
        </nav>
    </header>

    <main>

        <section id="products" class="py-4">
            <div class="container">

                <div class="text-center mb-5 ">
                    <h2 class="fw-bold">Our Products</h2>
                    <p class="text-muted">
                        Discover products you'll love
                    </p>
                </div>

                <div id="product-container" class="row g-4">


                </div>

            </div>
            <button id="scrollTopBtn">↑</button>
        </section>  

          <footer class="foot-section py-1 bg-dark">
            <div class="container">
                <div class="row ">
                    <div class="col-12">
                        <div class="d-flex flex-wrap mt-3">
                            <div class="col-12 text-center col-lg-6  text-lg-start">

                                     All Rights Reserved.</p>

                            <div class="col-12 text-center col-lg-6 text-lg-end">

                            </div>
                        </div>

                    </div>
                </div>

            </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
